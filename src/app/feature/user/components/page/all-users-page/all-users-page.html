<main class="min-h-screen bg-slate-50 px-6 py-10">
  <div class="mx-auto max-w-5xl">
    <div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
          Users
        </h1>

        <p class="mt-1 text-sm text-slate-500">
          Browse and manage your user records.
        </p>
      </div>

      <button class="register-user-button" type="button" (click)="registerUser.emit()">
        <span>Register user</span>
      </button>
    </div>

    @if (isLoading()) {
    <div class="rounded-2xl border border-indigo-100 bg-white px-6 py-12 text-center shadow-sm">
      <p class="text-sm font-semibold text-indigo-600">Loading users...</p>
    </div>
    } @else {
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
      <div class="overflow-x-auto">
        <table class="w-max min-w-full whitespace-nowrap">
          <thead class="bg-gradient-to-r from-indigo-700 to-indigo-600">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-indigo-50">
                UUID
              </th>
              <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-indigo-50">
                Full Name
              </th>
              <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-indigo-50">
                Email
              </th>
              <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-indigo-50">
                Actions
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            @for (user of users(); track user.id) {
            <tr class="group bg-white transition-colors duration-150 even:bg-slate-50/70 hover:bg-indigo-50">
              <td class="px-6 py-5 font-mono text-xs text-slate-500 group-hover:text-indigo-700">
                {{ user.id }}
              </td>
              <td class="px-6 py-5 text-sm font-bold text-slate-900">
                {{ user.fullName }}
              </td>
              <td class="px-6 py-5 text-sm font-semibold text-indigo-600">{{ user.email }}</td>
              <td class="px-6 py-5">
                <div class="user-actions">
                  <button class="edit-action" type="button" (click)="editUser.emit(user.id)">
                    Edit
                  </button>
                  <button class="delete-action" type="button" (click)="deleteUser.emit(user.id)">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
            } @empty {
            <tr>
              <td colspan="6" class="px-6 py-14 text-center text-sm font-medium text-slate-500">
                No users found.
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>

      <nav aria-label="User pagination"
        class="flex flex-col items-center justify-between gap-4 border-t border-slate-200 bg-slate-50/80 px-6 py-5 sm:flex-row">
        <p class="text-sm font-medium text-slate-500">
          Page <span class="font-bold text-slate-900">{{ pageNumber() }}</span> of
          <span class="font-bold text-slate-900">{{ totalPages() || 1 }}</span>
        </p>

        <div class="flex flex-wrap items-center justify-center gap-3">
          <label class="text-sm font-medium text-slate-500">Rows per page
            <select #pageSizeSelect (change)="pageChangeSize.emit(+pageSizeSelect.value)">
              @for (size of pageSizeOptions; track size) {
                <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
              }
            </select>
          </label>
          <button type="button" [disabled]="pageNumber() === 1" (click)="pageChange.emit(pageNumber() - 1)"
            class="inline-flex min-w-28 items-center justify-center rounded-lg border border-indigo-200 bg-white px-5 py-2.5 text-sm font-bold text-indigo-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none disabled:hover:translate-y-0">
            Previous
          </button>

          <button type="button" [disabled]="pageNumber() >= totalPages() || pageNumber() >= 100" (click)="pageChange.emit(pageNumber() + 1)"
            class="inline-flex min-w-28 items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white shadow-md shadow-indigo-200 transition-all duration-200 hover:-translate-y-0.5 hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-200 focus:outline-none focus:ring-4 focus:ring-indigo-200 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 disabled:shadow-none disabled:hover:translate-y-0">
            Next
          </button>
        </div>
      </nav>
    </div>
    }
  </div>
</main>
