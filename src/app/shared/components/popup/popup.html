<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content [attr.aria-busy]="loading() || saving()">
  @if (loading()) {
    <p role="status">{{ loadingLabel() }}</p>
  }
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (!loading() && ready()) {
    <form [id]="formId" (submit)="submit($event)" novalidate>
      <fieldset [disabled]="saving()"><ng-content /></fieldset>
    </form>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" [disabled]="saving()" (click)="cancel()">Cancel</button>
  @if (!loading() && ready()) {
    <button type="submit" [attr.form]="formId" class="primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : submitLabel() }}
    </button>
  }
</mat-dialog-actions>
