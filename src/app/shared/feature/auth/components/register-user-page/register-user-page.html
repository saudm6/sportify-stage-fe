<main class="register-page">
  <div class="page-container">
    <button class="back-button" type="button" [disabled]="isSubmitting()" (click)="cancelled.emit()">
      <span aria-hidden="true">←</span>
      Back To Login
    </button>

    <section class="register-card">
      <header class="card-header">
        <div>
          <h1 class="page-title">Register user</h1>
          <p class="page-description">
            Enter the personal information and account details for the new user.
          </p>
        </div>
      </header>

      @if (errorMessage()) {
      <div class="error-banner" role="alert">
        {{ errorMessage() }}
      </div>
      }

      <form class="user-form" [formGroup]="userForm()" (ngSubmit)="submitted.emit()">
        <div class="form-content">
          <div class="form-grid">
            <label class="form-field">
              <span class="field-label">Full name</span>

              <input type="text" formControlName="fullName" placeholder="Enter full name" autocomplete="name" />

              @if (
              userForm().get('fullName')?.touched &&
              userForm().get('fullName')?.hasError('required')
              ) {
              <span class="field-error">
                Full name is required.
              </span>
              }
            </label>

            <label class="form-field">
              <span class="field-label">Email address</span>
              <input type="email" formControlName="email" placeholder="name@example.com" />

              @if (
              userForm().get('email')?.touched &&
              userForm().get('email')?.hasError('required')
              ) {
              <span class="field-error">
                Email address is required.
              </span>
              }

              @if (
              userForm().get('email')?.touched &&
              userForm().get('email')?.hasError('email')
              ) {
              <span class="field-error">
                Enter a valid email address.
              </span>
              }
            </label>

            <label class="form-field form-field-wide">
              <span class="field-label">Password</span>

              <input type="password" formControlName="password" placeholder="Enter password"
                autocomplete="new-password" />

              @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('required')
              ) {
              <span class="field-error">
                Password is required.
              </span>
              }

              @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('minlength')
              ) {
              <span class="field-error">
                Password must contain at least 8 characters.
              </span>
              }

              @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('uppercase')
              ) {
              <span class="field-error">
                Password must contain at least one uppercase letter.
              </span>
              }

              @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('lowercase')
              ) {
              <span class="field-error">
                Password must contain at least one lowercase letter.
              </span>
              }

              @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('number')
              ) {
              <span class="field-error">
                Password must contain at least one number.
              </span>
              }
            </label>
          </div>
        </div>

        <footer class="form-actions">
          <button class="button button-secondary" type="button" [disabled]="isSubmitting()" (click)="cancelled.emit()">
            Cancel
          </button>

          <button class="button button-primary" type="submit" [disabled]="isSubmitting()">
            @if (isSubmitting()) {
            <span class="button-spinner" aria-hidden="true"></span>
            Registering...
            } @else {
            Register user
            }
          </button>
        </footer>
      </form>
    </section>
  </div>
</main>
